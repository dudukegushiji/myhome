<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>神的网页</title>
	<style>
		h1{
			/*改写h1大标题的粗细*/ 
			font-weight: bolder;
			
			/*更改h1大标题的颜色*/
			color: red;
			
			/*给h1大标题居中*/
			text-align: center;
		}

		p{
			/*字体居中*/
			text-align: center;

			/*调整字体大小*/
			font-size: 90px;

			position: relative;
			top: 270px;

			color: white;
			
		}

		a{
			/*调整字体的颜色*/
			color: blue;
		}

		/*给背景插入图片*/
		body{
			/*同一个文件夹的图片名*/
			background-image: url("002.jpg");

			/*给图片居中*/
			background-position: center 20%;

			/*图片不要重复平铺*/
			background-repeat: no-repeat;
		}

		h6{
			color: bleak;
			top: 90px;
			font-size: 30px;
			position: relative;
			
		}

	</style>
</head>
<body>
	<h1>!这只是一个测试的网页！</h1>

	<h6>
		<span class="one">注意：可以使用edge浏览器的桌面模式查看更佳
		</span>
	 </h6>

	<p><a href="http://www.yuanshen.com" target="_blank"onclick="return confirm('此网页可能携带病毒，你确定跳转到新网页吗')">点击此处跳转至新的网页</a></p>



</body>
</html>
